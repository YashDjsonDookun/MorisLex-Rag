apiVersion: v1
kind: ConfigMap
metadata:
  name: morislex-rag-config
  namespace: morislex-rag
data:
  DATA_DIR: "/data"
  LOG_LEVEL: "INFO"
  LLM_BASE_URL: "http://ollama:11434"
  # No outbound access to Hugging Face; use only cached model (baked in image at /app/.cache/huggingface).
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
