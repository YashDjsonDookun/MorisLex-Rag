# Mount Mac RAG repo state/configs/logs so container uses same index as ./deploy.sh --local
# Edit path to match your MorisLex-Rag repo on the host (Rancher Desktop runs on the Mac, so this works).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: morislex-rag-ui
  namespace: morislex-rag
spec:
  template:
    spec:
      volumes:
        - name: host-rag-root
          hostPath:
            path: /Users/djson/Desktop/MorisLex-Rag
            type: Directory
      containers:
        - name: ui
          volumeMounts:
            - name: host-rag-root
              mountPath: /app/state
              subPath: state
            - name: host-rag-root
              mountPath: /app/configs
              subPath: configs
            - name: host-rag-root
              mountPath: /app/logs
              subPath: logs
            - name: host-data
              mountPath: /data
              readOnly: true
